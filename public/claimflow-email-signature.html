<!doctype html>
<html>
<head>
  <meta charset="utf-8">

    Upload claimflow-logo.png and claimflow-email-banner.jpg to your website public folder.

  -->

  <table cellpadding="0" cellspacing="0" border="0" style="font-family:Arial, Helvetica, sans-serif; color:#071c3a; max-width:650px;">

      <td style="padding:0 0 14px 0;">
        <table cellpadding="0" cellspacing="0" border="0" width="650">
          <tr>
            <td valign="middle" style="padding-right:22px;">
              <a href="https://getclaimflow.com" target="_blank" style="text-decoration:none; border:0;">
                <img src="https://getclaimflow.com/claimflow-logo.png" width="190" alt="ClaimFlow" style="display:block; border:0; outline:none; text-decoration:none;">
              </a>
            </td>
            <td width="1" style="background:#d8e0ea;"></td>
            <td valign="middle" style="padding-left:22px;">
              <div style="font-size:22px; line-height:26px; font-weight:700; letter-spacing:-0.3px; color:#071c3a;">Tom Reilly</div>
              <div style="font-size:12px; line-height:18px; font-weight:700; letter-spacing:1.4px; color:#5c708a; text-transform:uppercase;">Founder, ClaimFlow</div>
              <div style="font-size:13px; line-height:20px; color:#071c3a; padding-top:4px;">
                <span style="color:#1f7cff; font-weight:700;">E</span>
                <a href="mailto:tom@getclaimflow.com" style="color:#071c3a; text-decoration:none;">tom@getclaimflow.com</a>
                <span style="color:#b6c1cf; padding:0 8px;">|</span>
                <span style="color:#1f7cff; font-weight:700;">W</span>
                <a href="https://getclaimflow.com" target="_blank" style="color:#071c3a; text-decoration:none;">getclaimflow.com</a>
              </div>
            </td>
          </tr>
        </table>
      </td>
    </tr>

    <tr>
      <td style="padding:0 0 12px 0;">
        <a href="https://getclaimflow.com" target="_blank" style="text-decoration:none; border:0;">
          <img src="https://getclaimflow.com/claimflow-email-banner.jpg" width="650" alt="Do more R&amp;D claims without hiring more staff. Live evidence capture, more defensible claims, connects to dev tools." style="display:block; width:650px; max-width:650px; border:0; outline:none; text-decoration:none;">

      </td>
    </tr>

    <tr>
      <td style="border-top:1px solid #d8e0ea; padding-top:9px; font-size:10px; line-height:14px; color:#68788d;">
        This email and any attachments may contain confidential information intended only for the named recipient.<br>
        If you received it in error, please notify the sender and delete it.
      </td>
    </tr>
